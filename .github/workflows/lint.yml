name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Ruff + MyPy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile base (python:3.11-slim).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Project deps are installed so MyPy resolves real types from fastapi /
          # pydantic / etc. rather than treating them as Any (which would make CI
          # weaker than a local run). requirements-dev.txt pins Ruff + MyPy.
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy agent/ ingestion/ scripts/
